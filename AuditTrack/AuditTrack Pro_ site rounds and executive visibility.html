<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#181B30">
<title>AuditTrack Pro: site rounds and executive visibility</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F0; --surface:#FFFFFF; --sunk:#E9EAE4; --ink:#181B30; --muted:#585C70; --line:#D9DAD2;
  --accent:#3B44C4; --accent-ink:#FFFFFF; --accent-soft:#E5E6FA;
  --pass:#2B7A4B; --pass-soft:#DFF0E5; --warn:#9A620E; --warn-soft:#F7EAD2; --fail:#B3302A; --fail-soft:#F7DFDC;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11131D; --surface:#1A1D2B; --sunk:#232738; --ink:#ECEDF4; --muted:#A4A7BA; --line:#2E3247;
    --accent:#9097FF; --accent-ink:#11131D; --accent-soft:#272B50;
    --pass:#6FCB94; --pass-soft:#1B3427; --warn:#E8B45C; --warn-soft:#3A2D16; --fail:#F28C82; --fail-soft:#3D1F1D; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11131D; --surface:#1A1D2B; --sunk:#232738; --ink:#ECEDF4; --muted:#A4A7BA; --line:#2E3247;
  --accent:#9097FF; --accent-ink:#11131D; --accent-soft:#272B50;
  --pass:#6FCB94; --pass-soft:#1B3427; --warn:#E8B45C; --warn-soft:#3A2D16; --fail:#F28C82; --fail-soft:#3D1F1D; color-scheme: dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{line-height:1.2;margin:0} h1{font-size:1.75rem} h2{font-size:1.25rem} h3{font-size:1rem}
p{margin:0}
.muted{color:var(--muted)} .num{font-variant-numeric:tabular-nums}
.shell{display:flex;min-height:100%}
nav.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.nav .brand{display:none}
nav.nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:8px 4px 10px;min-height:56px;font-size:.78rem;color:var(--muted)}
nav.nav button svg{width:22px;height:22px}
nav.nav button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.nav .count{position:absolute;top:4px;left:calc(50% + 6px);background:var(--fail);color:#fff;font-size:.7rem;font-weight:700;border-radius:999px;padding:0 6px;line-height:1.5}
.main{flex:1;min-width:0;padding-bottom:84px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--paper);display:grid;grid-template-columns:1fr auto;grid-template-areas:"who role" "ctx ctx";gap:10px 12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
header.top .who{grid-area:who;min-width:0}
header.top .who strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .who span{font-size:.85rem;color:var(--muted)}
header.top .ctx{grid-area:ctx}
header.top .ctx:empty{display:none}
header.top .ctx select{min-height:44px}
.role{grid-area:role;display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.role button{border:0;background:none;border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--muted);min-height:36px}
.role button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
#view{max-width:1120px;margin:0 auto;padding:20px 18px 32px}
@media (max-width:520px){header.top .who span{display:none}}
@media (min-width:900px){
  nav.nav{position:sticky;top:0;bottom:auto;left:auto;right:auto;flex-direction:column;justify-content:flex-start;width:230px;height:100vh;border-top:0;border-right:1px solid var(--line);padding:20px 12px;gap:4px}
  nav.nav .brand{display:block;padding:4px 12px 20px}
  nav.nav button{flex:0;flex-direction:row;justify-content:flex-start;gap:12px;padding:10px 12px;border-radius:8px;font-size:.95rem;min-height:44px}
  nav.nav button[aria-current="page"]{background:var(--accent-soft)}
  nav.nav .count{position:static;margin-left:auto}
  .main{padding-bottom:0}
  header.top{grid-template-columns:1fr auto auto;grid-template-areas:"who ctx role";padding:14px 28px}
  header.top .ctx select{width:auto;min-width:220px}
  #view{padding:28px 28px 48px}
}
.brand-mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.brand-mark svg{width:28px;height:28px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--fail)}
.btn.small{min-height:40px;padding:0 14px;font-size:.9rem}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;margin:20px 0 12px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 14px;border-radius:8px;color:var(--muted);min-height:40px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-weight:700;font-size:.9rem}
.hint{font-size:.85rem;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea{min-height:88px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.badge.pass,.badge.low,.badge.green{background:var(--pass-soft);color:var(--pass)}
.badge.partial,.badge.med,.badge.amber{background:var(--warn-soft);color:var(--warn)}
.badge.fail,.badge.high,.badge.overdue,.badge.red{background:var(--fail-soft);color:var(--fail)}
.badge.crit{background:var(--fail);color:#fff}
.empty{padding:28px 20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.section{margin-top:34px}
.section > h2{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--fail-soft);color:var(--fail);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.alert svg{width:22px;height:22px;flex-shrink:0;margin-top:1px}
.alert p{color:var(--ink)}
/* today cards */
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px}
.tcard{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);min-height:96px}
.tcard b{font-size:1.05rem}
.tcard.done{border-color:var(--pass);background:var(--pass-soft)}
.tcard.flag{border-color:var(--warn);background:var(--warn-soft)}
/* ring */
.round{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{position:relative;width:124px;height:124px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--sunk)} .ring .fill{stroke:var(--accent);transition:stroke-dashoffset .6s ease}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .center b{font-size:1.8rem;line-height:1} .ring .center span{font-size:.8rem;color:var(--muted)}
.round .copy h1{margin-bottom:6px} .round .copy p{max-width:46ch}
@media (prefers-reduced-motion: reduce){.ring .fill{transition:none}}
/* list */
.list{display:flex;flex-direction:column;gap:8px}
.group-label{font-size:.9rem;font-weight:700;color:var(--muted);margin:18px 0 6px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:64px}
.item:hover{border-color:var(--accent)}
.item .mark{width:26px;height:26px;flex-shrink:0;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700}
.item .mark svg{width:16px;height:16px}
.item .mark.pass{background:var(--pass);border-color:var(--pass);color:#fff}
.item .mark.partial{background:var(--warn);border-color:var(--warn);color:#fff}
.item .mark.fail{background:var(--fail);border-color:var(--fail);color:#fff}
.item .mark.na{background:var(--sunk);color:var(--muted)}
.item .body{flex:1;min-width:0}
.item .title{font-weight:700}
.item .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.85rem;color:var(--muted);margin-top:2px}
.item .side{flex-shrink:0;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:640px){.item.esc{flex-wrap:wrap}.item.esc .side{width:100%;justify-content:flex-start;padding-left:40px}}
/* sheet */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);width:100%;max-width:660px;max-height:94vh;margin:auto auto 0;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,12,24,.5)}
@media (min-width:700px){dialog{margin:auto;border-radius:18px;max-height:88vh}}
.sheet{display:flex;flex-direction:column;max-height:inherit}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-body{overflow:auto;padding:16px 20px 20px}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);flex-wrap:wrap}
.icon-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--sunk);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{font-size:.8rem;padding:3px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.why{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin:12px 0 18px}
.steps{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px}
.steps label{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--paper);min-height:48px;cursor:pointer}
.steps input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex-shrink:0}
.results{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0 18px}
.results button{min-height:56px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:.9rem;padding:4px}
[data-r="pass"][aria-pressed="true"],[data-v="y"][aria-pressed="true"]{background:var(--pass)!important;border-color:var(--pass)!important;color:#fff}
[data-r="partial"][aria-pressed="true"]{background:var(--warn)!important;border-color:var(--warn)!important;color:#fff}
[data-r="fail"][aria-pressed="true"],[data-v="n"][aria-pressed="true"]{background:var(--fail)!important;border-color:var(--fail)!important;color:#fff}
[data-r="na"][aria-pressed="true"],[data-v="na"][aria-pressed="true"]{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--paper)}
.qi{padding:14px 0;border-bottom:1px solid var(--line)}
.qi:last-child{border-bottom:0}
.qi .q{font-weight:700;margin-bottom:4px}
.qi .sub{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--muted);margin-bottom:10px}
.yn{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}
.yn button{min-height:48px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.yn .cam{width:56px;display:flex;align-items:center;justify-content:center;color:var(--accent)}
.yn .cam svg{width:22px;height:22px}
.need-photo{color:var(--warn);font-weight:700}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--sunk)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.note-flag{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:.9rem;margin-bottom:14px}
.stamp{font-size:.8rem;color:var(--muted);margin-top:4px}
/* dashboard */
.hero{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:760px){.hero{grid-template-columns:1.2fr 1fr;align-items:end}}
.score{display:flex;align-items:flex-end;gap:10px}
.score b{font-size:5rem;line-height:.85;font-weight:700;letter-spacing:-.02em}
.score .pct{font-size:2rem;font-weight:700}
.score-caption{margin-top:12px;max-width:50ch}
.spark{width:100%;height:90px} .spark .ln{fill:none;stroke:var(--accent);stroke-width:2.5} .spark .ar{fill:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:24px}
@media (min-width:760px){.stats{grid-template-columns:repeat(var(--cols,4),1fr)}}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-size:1.6rem} .stat span{font-size:.85rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(110px,190px) 1fr 48px;gap:12px;align-items:center;font-size:.92rem}
.bar{height:10px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--pass)} .bar i.mid{background:var(--warn)} .bar i.lowv{background:var(--fail)}
.grid2{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:860px){.grid2{grid-template-columns:1fr 1fr}}
.heat{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:.8rem;max-width:360px}
.heat .c{aspect-ratio:1.4;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.heat .lbl{display:flex;align-items:center;justify-content:center;color:var(--muted);padding:2px;text-align:center}
.h1v{background:var(--pass-soft);color:var(--pass)} .h2v{background:var(--warn-soft);color:var(--warn)} .h3v{background:var(--fail-soft);color:var(--fail)} .h4v{background:var(--fail);color:#fff}
.exports{display:flex;flex-wrap:wrap;gap:10px}
.callout{border-left:4px solid var(--accent);padding:4px 0 4px 14px;margin-top:14px;max-width:72ch}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table.loc{width:100%;border-collapse:collapse;font-size:.92rem;min-width:760px}
table.loc th{text-align:left;font-size:.82rem;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.loc td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.loc tr:last-child td{border-bottom:0}
table.loc tbody tr{cursor:pointer}
table.loc tbody tr:hover td{background:var(--paper)}
table.loc .nm b{display:block} table.loc .nm span{font-size:.82rem;color:var(--muted)}
.minibar{display:flex;align-items:center;gap:8px}
.minibar .bar{width:70px;height:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.85rem;white-space:nowrap}
.status i{width:10px;height:10px;border-radius:50%;display:inline-block}
.status.green{color:var(--pass)} .status.green i{background:var(--pass)}
.status.amber{color:var(--warn)} .status.amber i{background:var(--warn)}
.status.red{color:var(--fail)} .status.red i{background:var(--fail)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px}
.locrow{display:grid;grid-template-columns:1.3fr 1fr 1.2fr auto;gap:8px;margin-bottom:8px;align-items:center}
@media (max-width:640px){.locrow{grid-template-columns:1fr 1fr}.locrow button{grid-column:span 2}}
.progs label{display:flex;gap:12px;align-items:flex-start;padding:10px 0;cursor:pointer}
.progs input{width:22px;height:22px;accent-color:var(--accent);flex-shrink:0;margin-top:2px}
/* onboarding */
.onboard{max-width:600px;margin:4vh auto 0}
.onboard h1{font-size:2.2rem;margin:18px 0 10px}
.onboard .lead{font-size:1.1rem;color:var(--muted);margin-bottom:26px;max-width:50ch}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 28px}
.facts div{border-top:3px solid var(--accent);padding-top:8px;font-size:.9rem}
.facts b{display:block;font-size:1.3rem}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:10px;z-index:50;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){#toast{bottom:32px}}
#print-root{display:none}
.rgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.rgrid{grid-template-columns:repeat(2,1fr)}}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.rcard .aud{font-size:.85rem;font-weight:700;color:var(--accent);margin:4px 0 6px}
.btn:disabled{opacity:.45;cursor:default}
.yn.num{grid-template-columns:1fr auto auto}
.numin{display:flex;align-items:center;gap:8px}.numin span{font-weight:700}
.numstat{font-size:.85rem;font-weight:700;margin-top:6px}
@media print{body::before{display:none}.shell,#toast,dialog{display:none!important}#print-root{display:block}:root{padding:0}}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="main"><header class="top" id="top"></header><main id="view"></main></div>
</div>
<dialog id="sheet" aria-label="Details"><div class="sheet" id="sheet-body"></div></dialog>
<input type="file" id="photo-input" accept="image/*" hidden>
<input type="file" id="restore-input" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<div id="print-root"></div>
<script>
/* ===================== Programs and control library ===================== */
const APP='AuditTrack Pro';
const PROGS={phys:'Physical security rounds',ops:'Daily open and close',osha:'OSHA and safety',hipaa:'HIPAA security and privacy'};
const PROG_DESC={phys:'A 3-minute weekly photo walk-through of HIPAA physical safeguards.',ops:'2-minute opening and closing checklists every business day.',osha:'Eyewash, sharps, exits, extinguishers, bloodborne pathogens, and more.',hipaa:'The Security Rule risk analysis split into short recurring checks, some handled once for the whole organization.'};
const CATS={admin:'Administrative',physical:'Physical',technical:'Technical',privacy:'Privacy & patient rights',breach:'Incidents & continuity',vendor:'Vendors & BAAs'};
const CSF={GV:'Govern',ID:'Identify',PR:'Protect',DE:'Detect',RS:'Respond',RC:'Recover'};
const HICP={1:'Email protection',2:'Endpoint protection',3:'Access management',4:'Data protection & loss prevention',5:'Asset management',6:'Network management',7:'Vulnerability management',8:'Incident response',9:'Connected medical devices',10:'Governance & oversight'};
const FREQ={daily:'Every business day',weekly:'Weekly',monthly:'Monthly',quarterly:'Quarterly',semiannual:'Twice a year',annual:'Yearly'};
const PER_YEAR={daily:260,weekly:52,monthly:12,quarterly:4,semiannual:2,annual:1};
// check-style task

/* ===================== Utilities ===================== */
const DAY=864e5;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const addMonths=(d,n)=>{const x=new Date(d);const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(day,last));return x};
const startOfWeek=d=>{const x=sod(d);return addDays(x,-((x.getDay()+6)%7))};
const fmt=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtY=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtT=d=>new Date(d).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const isoDay=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const parseDay=s=>{const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=s=>document.querySelector(s);
const LVL={1:'Low',2:'Medium',3:'High'};
const rate=(l,i)=>{const s=l*i;return s>=9?['Critical','crit',4]:s>=6?['High','high',3]:s>=3?['Medium','med',2]:['Low','low',1]};
const dueDaysFor=s=>s>=9?14:s>=6?30:s>=3?60:90;

const EVF={};
const idb={db:null,
  open(){return new Promise(res=>{try{const r=indexedDB.open('audittrack-evidence',1);r.onupgradeneeded=()=>r.result.createObjectStore('ev',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>res(null)}catch(e){res(null)}})},
  async tx(mode,fn){const db=this.db||await this.open();if(!db)throw new Error('no-idb');return new Promise((res,rej)=>{const t=db.transaction('ev',mode);const req=fn(t.objectStore('ev'));t.oncomplete=()=>res(req?req.result:undefined);t.onerror=()=>rej(t.error)})},
  async put(r){try{await this.tx('readwrite',s=>s.put(r))}catch(e){EVF[r.id]=r}},
  async get(id){if(EVF[id])return EVF[id];try{return await this.tx('readonly',s=>s.get(id))}catch(e){return null}},
  async del(id){delete EVF[id];try{await this.tx('readwrite',s=>s.delete(id))}catch(e){}},
  async all(){try{return ((await this.tx('readonly',s=>s.getAll()))||[]).concat(Object.values(EVF))}catch(e){return Object.values(EVF)}},
  async clear(){try{await this.tx('readwrite',s=>s.clear())}catch(e){}}
};

/* ===================== Entities and schedule ===================== */
function corp(){return {id:'corp',name:'Shared services',region:'Organization-wide',manager:S.org.it||S.org.exec,corp:true}}
function ents(){return [corp(),...S.locations]}
function ent(id){return id==='corp'?corp():S.locations.find(l=>l.id===id)}
function tasksFor(e){return LIB.filter(t=>S.org.progs.includes(t.prog)&&(e.corp?t.scope==='org':t.scope!=='org'))}
function assignee(eid,t){const e=ent(eid);return S.assign[eid+':'+t.id]||(t.cat==='technical'&&S.org.it?S.org.it:e?e.manager:'')}
function people(eid){const e=ent(eid);return [...new Set([e&&e.manager,S.org.exec,S.org.it,...S.locations.map(l=>l.manager)].filter(Boolean))]}
let SCH,OCCE={},SERIES={},OMAP={};
function buildSchedule(){
  const start=parseDay(S.org.start),today=sod(new Date());
  let y=0;while(addMonths(start,12*(y+1))<=today)y++;
  const ys=addMonths(start,12*y),ye=addMonths(start,12*(y+1));
  OCCE={};SERIES={};OMAP={};
  for(const e of ents()){
    const all=[];
    tasksFor(e).forEach(t=>{
      const i=LIB.indexOf(t),ser=[];
      const push=(n,d)=>{d=sod(d);if(d<ys||d>=ye)return;ser.push({id:e.id+':'+t.id+':'+y+':'+n,eid:e.id,task:t,due:d})};
      if(t.freq==='daily'){let n=0;for(let d=new Date(ys);d<ye;d=addDays(d,1),n++){const w=d.getDay();if(w>0&&w<6)push(n,d)}}
      else if(t.freq==='weekly'){let f=addDays(startOfWeek(ys),4);for(let n=0;f<ye;n++,f=addDays(f,7))push(n,f)}
      else if(t.freq==='monthly')for(let m=0;m<12;m++)push(m,addDays(addMonths(ys,m),(i*5)%24+2));
      else if(t.freq==='quarterly')for(let q=0;q<4;q++)push(q,addDays(addMonths(ys,3*q+(i%3)),(i*7)%22+2));
      else if(t.freq==='semiannual')for(let h=0;h<2;h++)push(h,addDays(addMonths(ys,6*h+(i%6)),12));
      else if(t.fixed){let d=new Date(ys.getFullYear(),t.fixed[0],t.fixed[1]);if(d<ys)d=new Date(ys.getFullYear()+1,t.fixed[0],t.fixed[1]);push(0,d)}
      else push(0,addDays(addMonths(ys,t.lastMonth?11:(i*5)%11),(i*3)%18+4));
      ser.sort((a,b)=>a.due-b.due);ser.forEach((o,k)=>{o.next=ser[k+1]||null});
      SERIES[e.id+':'+t.id]=ser;all.push(...ser);
    });
    all.sort((a,b)=>a.due-b.due);OCCE[e.id]=all;all.forEach(o=>{OMAP[o.id]=o});
  }
  SCH={ys,ye,y,today};
}
const sup=o=>!!(o.next&&o.next.due<=SCH.today);
const overdueOf=eid=>(OCCE[eid]||[]).filter(o=>o.due<SCH.today&&!S.done[o.id]&&!sup(o)&&o.task.freq!=='daily');
const missedOf=eid=>(OCCE[eid]||[]).filter(o=>o.due<SCH.today&&!S.done[o.id]&&sup(o)&&o.task.freq!=='daily');

/* ===================== Scoring ===================== */
function entScore(eid,asOf){
  asOf=asOf||SCH.today;const end=addDays(asOf,1).getTime();const b={};
  for(const o of OCCE[eid]||[]){if(o.due>asOf)break;const c=S.done[o.id];const x=b[o.task.prog]||(b[o.task.prog]={d:0,p:0});
    if(c&&Date.parse(c.at)<end){if(c.result==='na')continue;x.d++;x.p+=PTS[c.result]}else x.d++}
  const progs={};let sum=0,n=0;for(const p in b)if(b[p].d){progs[p]=Math.round(b[p].p/b[p].d*100);sum+=b[p].p/b[p].d;n++}
  return {score:n?Math.round(sum/n*100):null,progs};
}
function bucket(eids,keyFn,asOf){
  asOf=asOf||SCH.today;const end=addDays(asOf,1).getTime();const b={};
  for(const eid of eids)for(const o of OCCE[eid]||[]){if(o.due>asOf)break;const k=keyFn(o.task);if(k==null)continue;const c=S.done[o.id];const x=b[k]||(b[k]={d:0,p:0});
    if(c&&Date.parse(c.at)<end){if(c.result==='na')continue;x.d++;x.p+=PTS[c.result]}else x.d++}
  const out={};for(const k in b)out[k]=b[k].d?Math.round(b[k].p/b[k].d*100):null;return out;
}
function avg(arr){const v=arr.filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function escalations(eids){
  const out=[];const today=SCH.today;
  for(const eid of eids){const e=ent(eid);if(!e)continue;for(const t of tasksFor(e)){const ser=SERIES[eid+':'+t.id];if(!ser)continue;
    let k=-1;for(let j=ser.length-1;j>=0;j--)if(ser[j].due<today){k=j;break}
    if(k<1)continue;const a=ser[k],b=ser[k-1];if(S.done[a.id]||S.done[b.id])continue;
    const key=eid+':'+t.id;const ack=S.acks[key];if(ack&&ack.upTo>=isoDay(a.due))continue;
    let n=0;for(let j=k;j>=0&&!S.done[ser[j].id];j--)n++;
    out.push({key,eid,task:t,last:a,streak:n})}}
  return out.sort((x,y)=>y.streak-x.streak);
}
const risksOf=eids=>S.risks.filter(r=>eids.includes(r.eid));
const isOpen=r=>r.status==='open'||r.status==='progress';
function entStats(e){
  const today=SCH.today;const sc=entScore(e.id);const ws=startOfWeek(today),we=addDays(ws,7);
  const wk=(OCCE[e.id]||[]).filter(o=>o.due>=ws&&o.due<we&&(o.task.freq!=='daily'||o.due<=today));
  const wkDone=wk.filter(o=>S.done[o.id]).length;
  const od=overdueOf(e.id).length;const esc=escalations([e.id]).length;
  const op=risksOf([e.id]).filter(isOpen);const hi=op.filter(r=>r.l*r.i>=6).length;const crit=op.some(r=>r.l*r.i>=9);
  let last=0;for(const o of OCCE[e.id]||[]){const c=S.done[o.id];if(c){const t=Date.parse(c.at);if(t>last)last=t}}
  const s=sc.score;
  const status=(esc>0||crit||(s!=null&&s<70))?'red':(od>3||hi>0||(s!=null&&s<85))?'amber':'green';
  return {e,score:s,progs:sc.progs,wk:wk.length?Math.round(wkDone/wk.length*100):null,od,esc,open:op.length,hi,last,status};
}
function practiceMonths(eids){let n=0,total=0;
  for(let m=0;m<12;m++){const ms=addMonths(SCH.ys,m),me=addMonths(SCH.ys,m+1);if(addDays(me,7)>SCH.today)break;total++;
    let d=0,c=0;const lim=addDays(me,7).getTime();
    for(const eid of eids)for(const o of OCCE[eid]||[]){if(o.due<ms)continue;if(o.due>=me)break;d++;const x=S.done[o.id];if(x&&Date.parse(x.at)<=lim)c++}
    if(d&&c/d>=.8)n++}
  return {n,total}}
function trend(eids){const pts=[];for(let k=11;k>=0;k--){const d=addDays(SCH.today,-7*k);if(d<addDays(SCH.ys,7))continue;const s=avg(eids.map(id=>entScore(id,d).score));if(s!=null)pts.push({d,s})}return pts}
const cls=v=>v==null?'':v>=85?'':v>=65?'mid':'lowv';
const scopeEids=()=>{const r=S.ui.region;return r==='all'?ents().map(e=>e.id):S.locations.filter(l=>l.region===r).map(l=>l.id)};
const regions=()=>[...new Set(S.locations.map(l=>l.region).filter(Boolean))].sort();

/* ---------- Rounds (tasks) ---------- */
function markFor(c){if(!c)return '<span class="mark"></span>';const m={pass:['pass',ICON.check],partial:['partial',ICON.half],fail:['fail',ICON.x],na:['na','N/A']}[c.result];return '<span class="mark '+m[0]+'" aria-label="'+RES[c.result]+'">'+m[1]+'</span>'}
function itemRow(o,showLoc){
  const c=S.done[o.id];const late=!c&&o.due<SCH.today&&!sup(o);const t=o.task;
  return `<button class="item" data-act="open-task" data-id="${o.id}">${markFor(c)}<span class="body"><span class="title">${esc(t.title)}</span><span class="meta">${showLoc?'<span>'+esc(ent(o.eid).name)+'</span>':''}<span>${t.min} min</span><span>${PROGS[t.prog]}</span><span>${c?'Done '+fmt(c.at):'Due '+fmt(o.due)}</span><span>${esc(c?c.by:assignee(o.eid,t))}</span></span></span><span class="side">${late?'<span class="badge overdue">Overdue</span>':c?'<span class="badge '+c.result+'">'+RES[c.result]+'</span>':''}</span></button>`;
}
function escBanner(eid){const es=escalations([eid]);if(!es.length)return '';
  return `<div class="alert" role="alert">${ICON.bell}<p><b>Leadership has been alerted.</b> ${es.length===1?esc(es[0].task.title)+' was':es.length+' checks were'} missed ${es.length===1?es[0].streak:'2 or more'} times in a row. Completing the next one clears the alert.</p></div>`}
function viewTasks(eid){
  const e=ent(eid);const today=SCH.today;const ws=startOfWeek(today),we=addDays(ws,7);
  const all=OCCE[eid]||[];
  let daily=all.filter(o=>o.task.freq==='daily'&&+o.due===+today);let dayLabel='Today';
  if(!daily.length){const prev=all.filter(o=>o.task.freq==='daily'&&o.due<today);if(prev.length){const d=prev[prev.length-1].due;daily=prev.filter(o=>+o.due===+d);dayLabel='Last business day, '+d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}}
  const late=overdueOf(eid).filter(o=>o.due<ws);
  const week=all.filter(o=>o.task.freq!=='daily'&&o.due>=ws&&o.due<we);
  const round=[...late,...week];
  const doneN=round.filter(o=>S.done[o.id]).length,total=round.length;
  const mins=round.filter(o=>!S.done[o.id]).reduce((a,o)=>a+o.task.min,0);
  const Cc=2*Math.PI*54,pct=total?doneN/total:1;
  const copy=total===0?'Nothing scheduled this week.':doneN===total?'Done for the week. The next round starts Monday.':'About '+mins+' minutes left'+(late.length?', including '+late.length+' carried over.':'.');
  const todayHTML=e.corp?'':(daily.length?`<h2 style="margin-bottom:10px">${dayLabel}</h2><div class="today">${daily.map(o=>{const c=S.done[o.id];const st=!c?'':c.result==='pass'?'done':'flag';return `<button class="tcard ${st}" data-act="open-task" data-id="${o.id}"><b>${esc(o.task.title)}</b><span class="muted" style="font-size:.88rem">${c?(c.result==='pass'?'Done at ':'Done with exceptions at ')+new Date(c.at).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):o.task.items.length+' items, about '+o.task.min+' min'}</span></button>`}).join('')}</div>`:'');
  const seg=S.ui.seg;let list='';
  if(seg==='week')list=round.length?'<div class="list">'+round.sort((a,b)=>(!!S.done[a.id]-!!S.done[b.id])||(a.due-b.due)).map(o=>itemRow(o)).join('')+'</div>':'<div class="empty">No checks due this week.</div>';
  else if(seg==='upcoming'){const up=all.filter(o=>o.task.freq!=='daily'&&o.due>=we&&o.due<addDays(we,42)&&!S.done[o.id]);const g={};up.forEach(o=>{const k=isoDay(startOfWeek(o.due));(g[k]=g[k]||[]).push(o)});
    list=up.length?Object.keys(g).map(k=>'<div class="group-label">Week of '+fmt(parseDay(k))+'</div><div class="list">'+g[k].map(o=>itemRow(o)).join('')+'</div>').join(''):'<div class="empty">Nothing in the next 6 weeks.</div>'}
  else{const d=all.filter(o=>S.done[o.id]).sort((a,b)=>Date.parse(S.done[b.id].at)-Date.parse(S.done[a.id].at)).slice(0,60);list=d.length?'<div class="list">'+d.map(o=>itemRow(o)).join('')+'</div>':'<div class="empty">Completed checks collect here as your audit trail.</div>'}
  return `${escBanner(eid)}${e.corp?'<p class="muted" style="margin-bottom:16px;max-width:60ch">Organization-wide checks handled once for every location, such as BAAs, policies, MFA, and backups.</p>':''}${todayHTML}

function readFile(f){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(f)})}
function compress(u){return new Promise(res=>{const img=new Image();img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);const g=c.getContext('2d');g.drawImage(img,0,0,c.width,c.height);const stamp=new Date().toLocaleString();g.font='bold '+Math.max(14,Math.round(c.width/45))+'px sans-serif';const w=g.measureText(stamp).width;g.fillStyle='rgba(0,0,0,.55)';g.fillRect(c.width-w-20,c.height-Math.round(c.width/45)-18,w+20,Math.round(c.width/45)+18);g.fillStyle='#fff';g.fillText(stamp,c.width-w-10,c.height-10);try{res(c.toDataURL('image/jpeg',.72))}catch(e){res(u)}};img.onerror=()=>res(u);img.src=u})}

function barRows(items){return '<div class="bars">'+items.map(([l,v])=>`<div class="bar-row"><span>${esc(l)}</span><div class="bar"><i class="${cls(v)}" style="width:${v==null?0:v}%"></i></div><b class="num" style="text-align:right">${v==null?'–':v+'%'}</b></div>`).join('')+'</div>'}
function sparkSVG(pts){if(pts.length<2)return '<p class="muted" style="font-size:.9rem">The trend line appears after two weeks of rounds.</p>';
  const W=320,Hh=90,p=6;const x=i=>p+i*(W-2*p)/(pts.length-1);const y=v=>Hh-p-(v/100)*(Hh-2*p);const line=pts.map((q,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(q.s).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="Readiness over ${pts.length} weeks, from ${pts[0].s}% to ${pts[pts.length-1].s}%"><path class="ar" d="${line} L${x(pts.length-1)} ${Hh} L${x(0)} ${Hh}Z"/><path class="ln" d="${line}" vector-effect="non-scaling-stroke"/></svg><div style="display:flex;justify-content:space-between;font-size:.8rem" class="muted"><span>${fmt(pts[0].d)}</span><span>Last ${pts.length} weeks</span><span>Today</span></div>`}
const statusHTML=s=>`<span class="status ${s}"><i></i>${STATUS[s]}</span>`;
function escList(es,canAck){return '<div class="list">'+es.map(x=>{const e=ent(x.eid);return `<div class="item esc" style="cursor:default"><span class="mark fail">${ICON.x}</span><span class="body"><span class="title">${esc(e.name)}: ${esc(x.task.title)}</span><span class="meta"><span>Missed ${x.streak} in a row</span><span>Last due ${fmt(x.last.due)}</span><span>${esc(assignee(x.eid,x.task))}</span></span></span>${canAck?`<span class="side"><button class="btn small" data-act="ack" data-id="${x.key}" data-due="${isoDay(x.last.due)}">Mark followed up</button></span>`:''}</div>`}).join('')+'</div>'}
function escGrouped(es){const g={};es.forEach(x=>{(g[x.eid]=g[x.eid]||[]).push(x)});
  return '<div class="list">'+Object.keys(g).sort((a,b)=>g[b].length-g[a].length).map(eid=>{const e=ent(eid),xs=g[eid];const names=xs.slice(0,3).map(x=>x.task.title).join(', ')+(xs.length>3?', and '+(xs.length-3)+' more':'');
  return `<div class="item esc" style="cursor:default"><span class="mark fail">${ICON.x}</span><span class="body"><span class="title">${esc(e.name)}: ${xs.length} check${xs.length>1?'s':''} missed 2 or more times in a row</span><span class="meta"><span>${esc(names)}</span><span>${esc(e.manager)}</span></span></span><span class="side"><button class="btn small" data-act="drill" data-id="${eid}">View</button><button class="btn small" data-act="ack-all" data-id="${eid}">Mark followed up</button></span></div>`}).join('')+'</div>'}
function exceptionsOf(eid){const since=addDays(SCH.today,-7);const out=[];for(const o of OCCE[eid]||[]){if(o.task.kind!=='round'||o.due<since||o.due>SCH.today)continue;const c=S.done[o.id];if(!c||!c.ans)continue;c.ans.forEach((a,i)=>{const it=o.task.items[i];if(a==='n')out.push({o,q:it.num&&c.vals&&c.vals[i]!=null?it.q+': '+c.vals[i]+it.num.unit+' (out of range)':it.q,c})})}return out.reverse()}

function enabledIds(ids){return ids.filter(id=>LIBMAP[id]&&S.org.progs.includes(LIBMAP[id].prog))}
function specEval(checks,eids){
  if(!checks.length)return {status:'Document manually',score:null,last:0,open:0,names:''};
  const en=enabledIds(checks);if(!en.length)return {status:'Program not enabled',score:null,last:0,open:0,names:''};
  const set=new Set(en);const sc=bucket(eids,t=>set.has(t.id)?'x':null).x;let last=0;
  for(const eid of eids)for(const id of en){for(const o of SERIES[eid+':'+id]||[]){const c=S.done[o.id];if(c){const t=Date.parse(c.at);if(t>last)last=t}}}
  const open=S.risks.filter(r=>isOpen(r)&&eids.includes(r.eid)&&set.has(r.taskId)).length;
  const status=sc==null?'Not yet assessed':sc>=85?'Implemented':sc>=50?'Partially implemented':'Not implemented';
  return {status,score:sc==null?null:sc,last,open,names:en.map(id=>LIBMAP[id].title).join('; ')};
}
function latestResults(eids,ids){const out=[];for(const eid of eids)for(const id of ids){const ser=SERIES[eid+':'+id];if(!ser)continue;for(let j=ser.length-1;j>=0;j--){const c=S.done[ser[j].id];if(c){out.push({eid,id,c});break}}}return out}
function insEval(q){

  else{const en=enabledIds(checks);const names=[...new Set(en.map(c=>LIBMAP[c].title))].join('; ');const L=latestResults(ents().map(e=>e.id),en);
    if(!en.length)basis='No matching check enabled. Answer from your records.';

function toHTML(doc){
  return '<div class="rpt">'+doc.blocks.map(x=>{switch(x.t){
    case 'title':return `<p class="muted">${esc(x.kicker)}</p><h1>${esc(x.text)}</h1>${x.sub?'<p>'+esc(x.sub)+'</p>':''}`;
    case 'h':return '<h2>'+esc(x.text)+'</h2>';case 'sub':return '<h3>'+esc(x.text)+'</h3>';
    case 'p':return '<p>'+esc(x.text)+'</p>';case 'note':return '<p class="muted" style="font-size:9pt">'+esc(x.text)+'</p>';
    case 'kpis':return '<div class="kpis" style="grid-template-columns:repeat('+x.items.length+',1fr)">'+x.items.map(([v,l])=>'<div><b>'+esc(v)+'</b>'+esc(l)+'</div>').join('')+'</div>';
    case 'kv':return '<table>'+x.rows.map(r=>'<tr><th style="width:30%">'+esc(r[0])+'</th><td>'+esc(r[1])+'</td></tr>').join('')+'</table>';
    case 'table':return '<table><tr>'+x.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr>'+x.rows.map(r=>'<tr>'+r.map(c=>'<td'+(CELLCOLOR[c]?' style="color:rgb('+CELLCOLOR[c].join(',')+');font-weight:700"':'')+'>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table>';
    case 'imgs':return '<div class="ph">'+x.items.map(i=>'<figure style="margin:0;width:160px"><img src="'+i.src+'" alt="" width="160" height="120"><figcaption style="font-size:8pt">'+esc(i.cap)+'</figcaption></figure>').join('')+'</div>';
    case 'sig':return '<div class="sig">'+x.items.map(s=>'<div>'+esc(s)+'</div>').join('')+'</div>';}return ''}).join('')+'</div>';
}
function toPDF(doc){

  const tbl=(b,head)=>{ensure(Math.min(b.rows.length,3)*16+(head?24:6));const cs={};(b.widths||[]).forEach((w,i)=>{if(w!=='auto')cs[i]={cellWidth:w}});if(b.t==='kv')cs[0]={cellWidth:170,fontStyle:'bold',fillColor:[236,238,247]};
    pdf.autoTable({startY:y,head:head?[head]:undefined,body:b.rows,margin:{left:M,right:M,top:M,bottom:Hh-BOT},theme:'grid',
      styles:{font:'helvetica',fontSize:b.small?7:8.2,cellPadding:3,lineColor:[207,208,200],lineWidth:.5,textColor:INK,overflow:'linebreak',valign:'top'},
      headStyles:{fillColor:[236,238,247],textColor:INK,fontStyle:'bold'},columnStyles:cs,rowPageBreak:'avoid',
      didParseCell:d=>{if(d.section==='body'){const c=CELLCOLOR[d.cell.raw];if(c){d.cell.styles.textColor=c;d.cell.styles.fontStyle='bold'}}}});
    y=pdf.lastAutoTable.finalY+12};
  for(const b of doc.blocks){switch(b.t){
    case 'title':text(b.kicker,8.5,'normal',MUT,2);text(b.text,20,'bold',INK,2);if(b.sub)text(b.sub,9.5,'normal',INK,6);break;
    case 'h':y+=10;ensure(60);text(b.text,13,'bold',ACC);pdf.setDrawColor(...ACC);pdf.setLineWidth(1.2);pdf.line(M,y+1,W-M,y+1);y+=9;break;
    case 'sub':y+=4;ensure(50);text(b.text,10,'bold',INK,3);break;
    case 'p':text(b.text,9.2,'normal',INK,6);break;
    case 'note':text(b.text,7.8,'normal',MUT,6);break;
    case 'kpis':{const n=b.items.length,g=8,bw=(W-2*M-(n-1)*g)/n;ensure(56);b.items.forEach(([v,l],i)=>{const x=M+i*(bw+g);pdf.setDrawColor(207,208,200);pdf.setLineWidth(.8);pdf.rect(x,y,bw,48);pdf.setFont('helvetica','bold');pdf.setFontSize(15);pdf.setTextColor(...INK);pdf.text(String(v),x+8,y+20);pdf.setFont('helvetica','normal');pdf.setFontSize(7.8);pdf.setTextColor(...MUT);pdf.text(pdf.splitTextToSize(l,bw-16),x+8,y+33)});y+=60;break}
    case 'kv':tbl(b,null);break;
    case 'table':tbl(b,b.head);break;
    case 'imgs':{const per=doc.landscape?5:4,g=10,iw=(W-2*M-(per-1)*g)/per,ih=iw*.75;b.items.forEach((im,i)=>{if(i%per===0){if(i)y+=ih+26;ensure(ih+26)}const x=M+(i%per)*(iw+g);try{pdf.addImage(im.src,im.src.startsWith('data:image/png')?'PNG':'JPEG',x,y,iw,ih)}catch(e){}pdf.setFont('helvetica','normal');pdf.setFontSize(6.8);pdf.setTextColor(...MUT);pdf.text(pdf.splitTextToSize(im.cap,iw).slice(0,2),x,y+ih+9)});y+=ih+30;break}
    case 'sig':y+=26;ensure(40);{const bw=(W-2*M-30)/2;b.items.forEach((s,i)=>{const x=M+i*(bw+30);pdf.setDrawColor(...INK);pdf.setLineWidth(.8);pdf.line(x,y,x+bw,y);pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(...INK);pdf.text(s,x,y+11)});y+=24}break;
  }}
  const n=pdf.getNumberOfPages();for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFont('helvetica','normal');pdf.setFontSize(7.2);pdf.setTextColor(...MUT);pdf.text(S.org.name+'  |  '+doc.title+'  |  Generated '+fmtY(new Date())+' by '+APP,M,Hh-22);pdf.text('Page '+i+' of '+n,W-M,Hh-22,{align:'right'})}

}
function toXLSX(doc){
  const wb=XLSX.utils.book_new();const used={};let lastH=doc.title;
  for(const b of doc.blocks){if(b.t==='h')lastH=b.text.replace(/^\d+\.\s*/,'');if(b.t!=='table'&&b.t!=='kv')continue;
    let name=(b.sheet||lastH).replace(/[\[\]:*?\/\\]/g,'').slice(0,28)||'Sheet';let nm=name,k=2;while(used[nm.toLowerCase()])nm=name.slice(0,26)+' '+k++;used[nm.toLowerCase()]=1;
    const aoa=b.t==='kv'?b.rows:[b.head,...b.rows];const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols']=aoa[0].map((_,i)=>{let m=8;for(const r of aoa){const l=String(r[i]==null?'':r[i]).length;if(l>m)m=l}return {wch:Math.min(60,m+2)}});
    XLSX.utils.book_append_sheet(wb,ws,nm)}
  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]);
}

  const seen={};
  for(const e of ents()){const d=dil[e.id];
    for(const o of OCCE[e.id]){if(o.due>=today&&!(o.task.freq==='daily'&&+o.due===+today&&rnd()<.5))continue;
      const fk=e.id+':'+o.task.id;const f=forced[fk]&&!seen[fk];const age=(today-o.due)/DAY;
      if(!f&&rnd()>(age<7?d*.88:d))continue;
      const t=o.task;let at=o.task.freq==='daily'?new Date(+o.due+((t.id==='open'?7.5:17.5)+rnd())*36e5):addDays(o.due,Math.floor(rnd()*5)-3);if(at>new Date())at=new Date();
      const rec={by:assignee(e.id,t),at:at.toISOString()};
      if(t.kind==='round'){rec.ans=t.items.map(()=>rnd()<(1-d)*.22?'n':'y');t.items.forEach((it,i)=>{if(it.num){rec.vals=rec.vals||t.items.map(()=>null);rec.vals[i]=rec.ans[i]==='n'?(rnd()<.6?47+Math.round(rnd()*3):34+Math.round(rnd())):37+Math.round(rnd()*70)/10}});const m=rec.ans.length,fn=rec.ans.filter(a=>a==='n').length;rec.result=fn===0?'pass':fn/m>=.5?'fail':'partial';if(fn)rec.note='Corrected on the spot where possible.'}
      else{let r;if(f){seen[fk]=1;[r,rec.note]=forced[fk]}else{const x=rnd();const q=.6+.35*d;r=x<q?'pass':x<q+.2*(1-q)+.08?'partial':x<.985?'fail':'na';if(r==='partial')rec.note='Mostly in place; one item needs follow-up.';if(r==='fail')rec.note='Not in place at time of check.'}rec.result=r;rec.steps=t.steps.map(()=>r!=='fail')}
      S.done[o.id]=rec;
      if(!t.noRisk){const mk=[];if(t.kind==='round')rec.ans.forEach((a,i)=>{if(a==='n')mk.push(riskFromItem(o,i,rec.note,at))});else if(rec.result==='fail'||rec.result==='partial')mk.push(riskFrom(o,rec.result,rec.note,at));
        mk.forEach(rk=>{if(!f&&rnd()<.35+.5*d){rk.status='mitigated';rk.closed=addDays(at,Math.floor(rnd()*14)+2).toISOString();rk.plan='Corrected and re-checked.'}else if(parseDay(rk.due)<today&&rnd()<.6)rk.due=isoDay(addDays(today,5+Math.floor(rnd()*25)));
          if(fk==='corp:baa'){rk.plan='Requested BAA from answering service; following up weekly.';rk.status='progress'}if(fk==='corp:mfa')rk.plan='Bayside IT converting shared mailboxes and enforcing MFA.';S.risks.push(rk)})}
    }}
  S.incidents.push({id:uid(),eid:locs[2].id,kind:'privacy',title:'Lab results faxed to wrong number',discovered:isoDay(addDays(today,-19)),count:'1',description:'Results for one patient sent to a transposed fax number. Recipient pharmacy confirmed destruction.',phi:'yes',status:'notified',actions:'Destruction attestation received. Patient notified by letter. Logged for annual HHS report.',created:new Date().toISOString()});
  S.incidents.push({id:uid(),eid:locs[7].id,kind:'injury',title:'Needlestick during injection',discovered:isoDay(addDays(today,-6)),count:'1',description:'MA sustained needlestick while recapping. Followed post-exposure protocol.',phi:'no',status:'investigating',actions:'Post-exposure evaluation completed. Added to sharps injury log. Reviewing safety-engineered syringes.',created:new Date().toISOString()});
  S.ui.role='exec';S.ui.tab='dash';S.ui.loc=locs[0].id;save();render();window.scrollTo(0,0);toast('Demo network loaded. Switch to Site to see a manager’s view.');
}

/* ===================== Actions ===================== */
const ACT={
  tab:id=>{S.ui.tab=id;S.ui.drill=null;save();render();window.scrollTo(0,0)},
  role:id=>{S.ui.role=id;S.ui.tab=id==='exec'?'dash':'tasks';S.ui.drill=null;save();render();window.scrollTo(0,0)},
  seg:id=>{S.ui.seg=id;save();render()},rseg:id=>{S.ui.rseg=id;save();render()},
  drill:id=>{S.ui.drill=id;save();render();window.scrollTo(0,0)},undrill:()=>{S.ui.drill=null;save();render();window.scrollTo(0,0)},
  'open-task':id=>openTask(id),close:()=>closeSheet(),
  result:(id,el)=>{DRAFT.result=el.dataset.r;el.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));refreshDraftUI()},
  ans:(id,el)=>{const i=+el.dataset.i;DRAFT.ans[i]=el.dataset.v;if(el.dataset.v==='na'){const inp=el.closest('.qi').querySelector('[data-num]');if(inp){inp.value='';DRAFT.vals[i]=null}}el.parentElement.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));refreshDraftUI()},
  'all-yes':()=>{const its=OMAP[DRAFT.id].task.items;DRAFT.ans=DRAFT.ans.map((a,i)=>its[i].num?a:'y');document.querySelectorAll('#items .yn:not(.num) [data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v==='y')));refreshDraftUI()},
  'add-photo':()=>{PHOTO_FOR=null;$('#photo-input').click()},
  'item-photo':(id,el)=>{PHOTO_FOR=+el.dataset.i;$('#photo-input').click()},
  'del-photo':async(id,el)=>{const i=el.dataset.i;if(i==='')DRAFT.ev=DRAFT.ev.filter(x=>x!==id);else DRAFT.iev[i]=(DRAFT.iev[i]||[]).filter(x=>x!==id);await idb.del(id);refreshDraftUI()},
  'save-task':()=>saveTask(),
  'undo-task':()=>{if(!confirm('Clear this result? Risks it created stay in the plan.'))return;delete S.done[DRAFT.id];save();closeSheet();render();toast('Result cleared.')},
  'open-risk':id=>openRisk(id),'new-risk':()=>openRisk(null),'save-risk':id=>saveRisk(id),
  'del-risk':id=>{if(!confirm('Delete this risk?'))return;S.risks=S.risks.filter(r=>r.id!==id);save();closeSheet();render();toast('Risk deleted.')},
  'open-incident':id=>openIncident(id),'new-incident':()=>openIncident(null),'save-incident':id=>saveIncident(id),
  'del-incident':id=>{if(!confirm('Delete this incident record?'))return;S.incidents=S.incidents.filter(x=>x.id!==id);save();closeSheet();render();toast('Incident deleted.')},
  'ack-all':eid=>{escalations([eid]).forEach(x=>{S.acks[x.key]={at:new Date().toISOString(),by:S.org.exec,upTo:isoDay(x.last.due)}});save();render();toast('Follow-up recorded. Alerts return if the next cycle is missed.')},
  ack:(id,el)=>{S.acks[id]={at:new Date().toISOString(),by:S.org.exec,upTo:el.dataset.due};save();render();toast('Follow-up recorded. The alert returns if the next one is missed.')},
  signoff:()=>{const n=$('#so-name').value.trim();if(!n){toast('Enter your name to sign off.');return}if(!$('#so-ok').checked){toast('Confirm you reviewed the risk analysis.');return}S.signoffs.push({name:n,at:new Date().toISOString(),score:avg(ents().map(e=>entScore(e.id).score))});save();render();toast('Sign-off recorded.')},
  report:(id,el)=>runReport(id,el.dataset.fmt),
  'ins-review':()=>openIns(),'save-ins':()=>saveIns(),
  'open-reports':id=>{S.ui.rpLoc=id;S.ui.tab='reports';S.ui.drill=null;save();render();window.scrollTo(0,0)},
  backup:async()=>{const ev=await idb.all();saveFile(slug(S.org.name)+'-audittrack-backup-'+isoDay(new Date())+'.json',JSON.stringify({app:'audittrack',v:2,state:S,evidence:ev}))},
  restore:()=>$('#restore-input').click(),
  'add-loc':()=>{readSettings();S.locations.push({id:'l'+uid(),name:'New location',region:'',manager:S.org.exec});save();render();const rows=document.querySelectorAll('.locrow');const last=rows[rows.length-1];if(last){last.querySelector('input').focus();last.querySelector('input').select()}},
  'del-loc':id=>{const l=S.locations.find(x=>x.id===id);if(!l)return;if(S.locations.length<=1){toast('Keep at least one location.');return}if(!confirm('Remove '+l.name+' and all of its records?'))return;
    readSettings();S.locations=S.locations.filter(x=>x.id!==id);Object.keys(S.done).forEach(k=>{if(k.startsWith(id+':'))delete S.done[k]});S.risks=S.risks.filter(r=>r.eid!==id);S.incidents=S.incidents.filter(x=>x.eid!==id);save();render();toast('Location removed.')},
  'save-settings':()=>{if(readSettings()){save();render();toast('Settings saved.')}},
  reset:async()=>{if(!confirm('Erase all data on this device? Download a backup first if you need it.'))return;S=null;try{localStorage.removeItem(KEY)}catch(e){}await idb.clear();render()},
  demo:()=>{if(S&&!confirm('Replace current data with the demo network?'))return;makeDemo()},
  start:()=>{const g=id=>$(id).value.trim();const name=g('#ob-org');if(!name){toast('Enter your organization name to start.');$('#ob-org').focus();return}
    const loc={id:'l'+uid(),name:g('#ob-loc')||'Main location',region:'',manager:g('#ob-mgr')||'Site manager'};
    S=blank({name,exec:g('#ob-exec')||'Executive',it:g('#ob-it'),start:$('#ob-start').value||isoDay(new Date()),progs:Object.keys(PROGS)},[loc]);save();render();toast('Your first round is ready.')}
};
function readSettings(){
  const name=$('#s-org')?$('#s-org').value.trim():S.org.name;if(!name){toast('Organization name can’t be empty.');return false}
  const progs=[...document.querySelectorAll('[data-prog]')].filter(x=>x.checked).map(x=>x.dataset.prog);
  if($('#s-org')&&!progs.length){toast('Keep at least one program on.');return false}
  if($('#s-org'))Object.assign(S.org,{name,exec:$('#s-exec').value.trim()||S.org.exec,it:$('#s-it').value.trim(),start:$('#s-start').value||S.org.start,progs});
  document.querySelectorAll('.locrow').forEach(row=>{const l=S.locations.find(x=>x.id===row.dataset.loc);if(!l)return;const v=f=>row.querySelector('[data-f="'+f+'"]').value.trim();l.name=v('name')||l.name;l.region=v('region');l.manager=v('manager')||l.manager});
  return true;
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=ACT[el.dataset.act];if(fn){e.preventDefault();fn(el.dataset.id,el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-act]'))ACT.drill(e.target.dataset.id)});
document.addEventListener('change',e=>{const k=e.target.dataset.change;if(!k)return;if(k==='loc')S.ui.loc=e.target.value;if(k==='region')S.ui.region=e.target.value;if(k==='rloc')S.ui.rloc=e.target.value;if(k==='rpLoc')S.ui.rpLoc=e.target.value;if(k==='rpMonth')S.ui.rpMonth=e.target.value;save();render()});
$('#restore-input').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text());if(j.app!=='audittrack'||!j.state||!j.state.org)throw new Error('bad');if(S&&!confirm('Replace current data with this backup?'))return;
    S=j.state;await idb.clear();for(const r of j.evidence||[])await idb.put(r);save();render();toast('Backup restored.')}catch(err){toast('That file isn’t an AuditTrack Pro backup.')}});
S=loadState();
if(S){S.ui=Object.assign({role:'manager',tab:'tasks',seg:'week',rseg:'risks',region:'all',rloc:'all',drill:null},S.ui||{});S.acks=S.acks||{};S.ins=S.ins||{};S.signoffs=S.signoffs||[]}
render();
</script>
