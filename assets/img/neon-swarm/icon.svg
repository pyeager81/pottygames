<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nsbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B2A"/>
      <stop offset="60%" stop-color="#160B33"/>
      <stop offset="100%" stop-color="#1E0B3D"/>
    </linearGradient>
    <radialGradient id="nssheen" cx="30%" cy="20%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowSm" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="496" height="496" rx="132" fill="url(#nsbg)"/>
  <rect x="8" y="8" width="496" height="496" rx="132" fill="url(#nssheen)"/>

  <!-- starfield -->
  <g fill="#FFFFFF">
    <circle cx="100" cy="110" r="2.2" opacity="0.8"/>
    <circle cx="150" cy="360" r="1.8" opacity="0.6"/>
    <circle cx="410" cy="140" r="2" opacity="0.7"/>
    <circle cx="380" cy="330" r="1.6" opacity="0.5"/>
    <circle cx="90" cy="300" r="1.6" opacity="0.6"/>
    <circle cx="430" cy="380" r="2" opacity="0.7"/>
    <circle cx="130" cy="200" r="1.4" opacity="0.5"/>
  </g>

  <!-- enemy: magenta diamond (upper right) -->
  <g filter="url(#glowSm)">
    <path d="M 372 150 L 392 172 L 372 194 L 352 172 Z" fill="#FF2FD6"/>
  </g>

  <!-- enemy: cyan drifter (upper left) -->
  <g filter="url(#glowSm)">
    <circle cx="138" cy="155" r="16" fill="#2FE6F5"/>
  </g>

  <!-- bullets -->
  <g stroke="#8CF7FF" stroke-width="5" stroke-linecap="round" filter="url(#glowSm)">
    <line x1="256" y1="330" x2="248" y2="230"/>
    <line x1="256" y1="330" x2="264" y2="220"/>
  </g>

  <!-- ship -->
  <g filter="url(#glow)">
    <path d="M 256 300 L 296 378 L 256 358 L 216 378 Z" fill="#00F0FF"/>
    <path d="M 256 300 L 296 378 L 256 358 L 216 378 Z" fill="none" stroke="#EAFFFF" stroke-width="3"/>
  </g>
  <!-- engine glow -->
  <g filter="url(#glow)">
    <path d="M 244 372 L 256 410 L 268 372 Z" fill="#FFD23D"/>
  </g>

  <!-- XP gem -->
  <g filter="url(#glowSm)">
    <path d="M 350 300 L 362 312 L 350 324 L 338 312 Z" fill="#B45CFF"/>
  </g>
</svg>
